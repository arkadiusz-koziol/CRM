volumes:
  postgres-data:
  redis-data:

networks:
  backend:
name: "skytech"
services:
  proxy:
    container_name: skytech-proxy
    image: nginx:latest
    ports:
      - "127.0.0.1:8199:80"
    volumes:
      - ../backend:/var/www/app
      - ../.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    depends_on:
      - php

  php:
    container_name: skytech-php
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    volumes:
      - ../backend:/var/www/app
    networks:
      - backend
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: skytech-db
    image: postgres:16.0
    ports:
      - "127.0.0.1:5419:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'skytech-db'
      POSTGRES_USER: 'user'
    restart: always
    networks:
      - backend

  redis:
    container_name: skytech-redis
    image: redis:latest
    sysctls:
      - net.core.somaxconn=511
    volumes:
      - redis-data:/data
    networks:
      - backend
