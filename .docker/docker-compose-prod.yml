version: '3.8'

name: "crm"

networks:
  shared_network:
    external: true
    name: network

services:
  php:
    container_name: crm-php
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    volumes:
      - ../:/var/www/app
    networks:
      - shared_network

  nginx:
    container_name: crm-nginx
    image: nginx:latest
    ports:
      - "80:80"  # Wystawia HTTP publicznie
    volumes:
      - ../:/var/www/app
      - ./nginx/app-prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - shared_network
