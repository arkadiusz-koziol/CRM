name: "crm"

services:
  php:
    container_name: crm-php
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    volumes:
      - ../backend:/var/www/app
    networks:
      - shared_network

  nginx:
    container_name: crm-nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../backend:/var/www/app
      - ./nginx/app-prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - shared_network


  postgres:
    container_name: telemain-db
    image: postgres:16.0
    ports:
      - "127.0.0.1:5419:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'telemain-db'
      POSTGRES_USER: 'user'
    restart: always
    networks:
      - shared_network

  redis:
    container_name: telemain-redis
    image: redis:latest
    sysctls:
      - net.core.somaxconn=511
    volumes:
      - redis-data:/data
    networks:
      - shared_network


networks:
  shared_network:
    driver: bridge
