networks:
  shared_network:
    name: network
    external: true

name: "crm"

services:
  php:
    container_name: crm-php
    ports:
      - "127.0.0.1:8000:80"
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    volumes:
      - ../:/var/www/app
      - ./nginx/app-prod.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shared_network
