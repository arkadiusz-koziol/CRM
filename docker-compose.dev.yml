services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: crm_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=crm_dev
      - DB_USERNAME=crm_user
      - DB_PASSWORD=crm_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    ports:
      - "8199:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/public
    depends_on:
      - app

  pgsql:
    image: postgres:16-alpine
    container_name: crm_pgsql
    environment:
      POSTGRES_DB: crm_dev
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      - "6380:6379"
