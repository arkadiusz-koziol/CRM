
networks:
  skytech-dev:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  node-modules:
  pgadmin-data:

services:
  # PostgreSQL Database
  postgres:
    container_name: skytech-postgres-dev
    image: postgres:16.0
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'skytech-db'
      POSTGRES_USER: 'user'
    restart: unless-stopped
    networks:
      - skytech-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skytech-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    container_name: skytech-redis-dev
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    sysctls:
      - net.core.somaxconn=511
    restart: unless-stopped
    networks:
      - skytech-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP Backend (Laravel) - Nginx + PHP-FPM
  backend:
    container_name: skytech-backend-dev
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    ports:
      - "127.0.0.1:8199:80"
    volumes:
      - ./backend:/var/www/app
      - /var/www/app/vendor
      - ./.docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=skytech-db
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skytech-dev
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist --optimize-autoloader &&
        php artisan key:generate --force &&
        php artisan migrate --force &&
        /usr/local/bin/start.sh
      "

  # Web Application (Next.js)
  web:
    container_name: skytech-web-dev
    image: node:20-alpine
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - node-modules:/app/node_modules
      - /app/.next
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8199/api/v1
      - BACKEND_URL=http://host.docker.internal:8199
      - NEXT_PUBLIC_APP_NAME=Skytech
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - skytech-dev
    command: >
      sh -c "
        apk add --no-cache yarn &&
        yarn install &&
        yarn dev --hostname 0.0.0.0 --port 3000
      "

  # Mobile Development Server (Expo)
  mobile:
    container_name: skytech-mobile-dev
    image: node:20-alpine
    ports:
      - "127.0.0.1:19000:19000"
      - "127.0.0.1:19001:19001"
      - "127.0.0.1:19002:19002"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - /app/apps/mobile/.expo
    working_dir: /app
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_API_URL=http://localhost:8199/api/v1
      - EXPO_PUBLIC_APP_NAME=Skytech
      - EXPO_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - skytech-dev
    command: >
      sh -c "
        npm install -g pnpm@9.0.0 &&
        pnpm install &&
        cd apps/mobile &&
        pnpm dev --port 19000 --host 0.0.0.0
      "

  # Development Tools (Optional)
  mailhog:
    container_name: skytech-mailhog-dev
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI
    restart: unless-stopped
    networks:
      - skytech-dev

  # Database Admin (Optional)
  pgadmin:
    container_name: skytech-pgadmin-dev
    image: dpage/pgadmin4:latest
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@skytech.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - skytech-dev