name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

env:
  COMPOSER_CACHE_DIR: ~/.composer/cache

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.2']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
        coverage: xdebug

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: ${{ env.COMPOSER_CACHE_DIR }}
        key: php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          php-${{ matrix.php-version }}-composer-

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      working-directory: ./backend

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      working-directory: ./backend

    - name: Generate key
      run: php artisan key:generate
      working-directory: ./backend

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
      working-directory: ./backend

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
      working-directory: ./backend

    - name: Run Pint (dry-run)
      run: ./vendor/bin/pint --test
      working-directory: ./backend

    - name: Run PHPStan
      run: ./vendor/bin/phpstan analyse --memory-limit=2G
      working-directory: ./backend

    - name: Run PHP CodeSniffer
      run: ./vendor/bin/phpcs --standard=PSR12 app/ --report=full
      working-directory: ./backend

    - name: Run Composer Audit
      run: composer audit --format=json --output=audit.json
      working-directory: ./backend

    - name: Upload security audit results
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-${{ matrix.php-version }}
        path: ./backend/audit.json

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skytech_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        php-version: ['8.2']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
        coverage: xdebug

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: ${{ env.COMPOSER_CACHE_DIR }}
        key: php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          php-${{ matrix.php-version }}-composer-

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      working-directory: ./backend

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      working-directory: ./backend

    - name: Generate key
      run: php artisan key:generate
      working-directory: ./backend

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
      working-directory: ./backend

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
      working-directory: ./backend

    - name: Execute Unit tests
      run: php artisan test --testsuite=Unit --coverage --coverage-clover=storage/app/coverage-unit.xml
      working-directory: ./backend

    - name: Execute Feature tests
      run: php artisan test --testsuite=Feature --coverage --coverage-clover=storage/app/coverage-feature.xml
      working-directory: ./backend

    - name: Execute Integration tests
      run: php artisan test --testsuite=Integration --coverage --coverage-clover=storage/app/coverage-integration.xml
      working-directory: ./backend
      env:
        DB_CONNECTION: pgsql
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: skytech_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Execute Contract tests
      run: php artisan test --testsuite=Contract
      working-directory: ./backend

    - name: Execute E2E tests
      run: php artisan test --testsuite=E2E
      working-directory: ./backend

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/storage/app/coverage-unit.xml
        flags: unit
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload feature coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/storage/app/coverage-feature.xml
        flags: feature
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload integration coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/storage/app/coverage-integration.xml
        flags: integration
        name: codecov-umbrella
        fail_ci_if_error: false

  coverage-gate:
    name: Coverage Quality Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
        coverage: xdebug

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      working-directory: ./backend

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      working-directory: ./backend

    - name: Generate key
      run: php artisan key:generate
      working-directory: ./backend

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
      working-directory: ./backend

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
      working-directory: ./backend

    - name: Run tests with coverage
      run: php artisan test --coverage --coverage-text --coverage-clover=storage/app/coverage.xml
      working-directory: ./backend

    - name: Check coverage threshold
      run: |
        COVERAGE=$(php artisan test --coverage-text | grep -o 'Lines:.*%' | grep -o '[0-9]*\.[0-9]*%' | head -1 | sed 's/%//')
        echo "Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 98" | bc -l) )); then
          echo "Coverage is below 98% threshold"
          exit 1
        fi
        echo "Coverage meets 98% threshold"
      working-directory: ./backend

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      working-directory: ./backend

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      working-directory: ./backend

    - name: Generate key
      run: php artisan key:generate
      working-directory: ./backend

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
      working-directory: ./backend

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
      working-directory: ./backend

    - name: Run Infection
      run: ./vendor/bin/infection --configuration=infection.json5 --min-msi=80 --min-covered-msi=85
      working-directory: ./backend

  pint-fix:
    name: Pint Auto-fix
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      working-directory: ./backend

    - name: Run Pint (fix)
      run: ./vendor/bin/pint
      working-directory: ./backend

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "style: fix code style with Pint [skip ci]"
        git push
