name: Docs Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files (JSON)
        id: cf
        uses: tj-actions/changed-files@v44
        with:
          json: true
          fetch_depth: 0

      - name: Check docs-only changes
        id: docs_only
        env:
          CHANGED_FILES_JSON: ${{ steps.cf.outputs.all_changed_files }}
        run: |
          set -Eeuo pipefail

          RAW="$CHANGED_FILES_JSON"

          # 1) Zdejmij ucieczki \" → "  (GitHub potrafi podać tablicę w formie [\"a\",\"b\"])
          SANITIZED="$(printf '%s' "$RAW" | sed 's/\\"/"/g')"

          # 2) Jeżeli dalej to nie jest poprawny JSON, pokaż surowe wejście i zakończ grzecznie
          if ! echo "$SANITIZED" | jq -e . >/dev/null 2>&1; then
            echo "⚠️  Not valid JSON from changed-files output:"
            echo "$RAW"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "---- Changed files (first 50) ----"
          echo "$SANITIZED" | jq -r '.[]' | head -n 50
          echo "----------------------------------"

          if [[ "$(echo "$SANITIZED" | jq 'length')" -eq 0 ]]; then
            echo "No changed files detected → docs_only=false"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALLOWED_REGEX='^(docs/|README\.md$)'
          VIOLATIONS=0

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if ! [[ "$file" =~ $ALLOWED_REGEX ]]; then
              echo "❌ Outside docs: $file"
              VIOLATIONS=$((VIOLATIONS+1))
            fi
          done < <(echo "$SANITIZED" | jq -r '.[]')

          if (( VIOLATIONS == 0 )); then
            echo "✅ All files are in docs/** or README.md"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check labels
        id: labels
        run: |
          REQUIRED=("docs:auto" "low-risk")
          HAS_REQUIRED=true
          echo "PR labels: ${{ join(github.event.pull_request.labels.*.name, ', ') }}"
          for L in "${REQUIRED[@]}"; do
            if ! grep -qw "$L" <<< "${{ join(github.event.pull_request.labels.*.name, ' ') }}"; then
              echo "❌ Missing label: $L"
              HAS_REQUIRED=false
            fi
          done
          echo "has_required=$HAS_REQUIRED" >> "$GITHUB_OUTPUT"

      - name: Check PR title format
        id: check-title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          
          if echo "$TITLE" | grep -qE "^chore\(docs:crm\):"; then
            echo "✅ PR title format correct"
            echo "title_valid=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  PR title doesn't start with 'chore(docs:crm):' (continuing anyway)"
            echo "title_valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Check docs/qa status
        id: qa
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.info('No PR head SHA → treating as missing status');
              core.setOutput('ok', 'false');
              return;
            }
            // ✅ v7 wymaga github.rest.repos.*
            const res = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: sha });
            const statuses = res.data ?? [];
            core.info('Available statuses: ' + statuses.map(s => `${s.context}=${s.state}`).join(', '));
            const ok = statuses.some(s => s.context === 'docs/qa' && s.state === 'success');
            core.setOutput('ok', ok ? 'true' : 'false');

      - name: Enable auto-merge (squash)
        if: ${{ steps.docs_only.outputs.docs_only == 'true' && steps.labels.outputs.has_required == 'true' && steps.qa.outputs.ok == 'true' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      - name: Comment on PR
        if: ${{ steps.docs_only.outputs.docs_only == 'true' && steps.labels.outputs.has_required == 'true' && steps.qa.outputs.ok == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '✅ Auto-merge enabled for this documentation PR.\n\n' +
                    'Conditions met:\n' +
                    '- ✅ Only documentation files changed\n' +
                    '- ✅ Required labels: `docs:auto` + `low-risk`\n' +
                    '- ✅ Status check `docs/qa` passed\n\n' +
                    'This PR will be automatically merged when all required checks pass.'
            });

      - name: Log skipped conditions
        if: ${{ steps.docs_only.outputs.docs_only != 'true' || steps.labels.outputs.has_required != 'true' || steps.qa.outputs.ok != 'true' }}
        run: |
          echo "⚠️  Auto-merge skipped due to unmet conditions:"
          echo "  - Docs only: ${{ steps.docs_only.outputs.docs_only }}"
          echo "  - Has required labels: ${{ steps.labels.outputs.has_required }}"
          echo "  - QA status ok: ${{ steps.qa.outputs.ok }}"

